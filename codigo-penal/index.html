<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visor del Código Penal — Paraguay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #2d2d2d; display: flex; flex-direction: column; overflow: hidden; }

        .header { background: #1a2a4a; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; flex-shrink: 0; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header h1 i { color: #d4a843; margin-right: 8px; }
        .header .subtitle { font-size: 12px; opacity: 0.8; font-weight: 300; display: block; margin-top: 2px; }
        .btn-back { background: #d4a843; color: #fff; border: none; padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
        .btn-back:hover { background: #b8922e; }

        .main { display: flex; flex: 1; overflow: hidden; }

        .sidebar { width: 340px; background: #fff; border-right: 1px solid #e0e4ea; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
        .sidebar-header { padding: 12px 15px; border-bottom: 1px solid #e0e4ea; background: #f8f9fa; }
        .sidebar-buscador { display: flex; align-items: center; background: #fff; border: 1px solid #d0d4da; border-radius: 6px; overflow: hidden; }
        .sidebar-buscador input { flex: 1; padding: 7px 10px; border: none; outline: none; font-size: 13px; }
        .sidebar-buscador button { background: transparent; border: none; padding: 7px 12px; color: #888; cursor: pointer; }
        .sidebar-buscador button:hover { color: #1a2a4a; }
        .sidebar-content { flex: 1; overflow-y: auto; padding: 10px; }

        .sidebar-counter { font-size: 11px; color: #888; padding: 0 4px 8px; text-transform: uppercase; letter-spacing: 0.5px; }

        .grupo-titulo { margin-bottom: 3px; }
        .grupo-titulo > summary { padding: 7px 8px; font-size: 12px; font-weight: 700; color: #1a2a4a; cursor: pointer; border-radius: 4px; list-style: none; text-transform: uppercase; letter-spacing: 0.3px; user-select: none; }
        .grupo-titulo > summary::-webkit-details-marker { display: none; }
        .grupo-titulo > summary::before { content: '▸'; display: inline-block; margin-right: 6px; transition: transform 0.2s; }
        .grupo-titulo[open] > summary::before { transform: rotate(90deg); }
        .grupo-titulo > summary:hover { background: #f0f2f5; }

        .grupo-capitulo { margin: 2px 0 2px 8px; }
        .grupo-capitulo > summary { padding: 5px 8px; font-size: 11px; font-weight: 600; color: #555; cursor: pointer; border-radius: 3px; list-style: none; user-select: none; }
        .grupo-capitulo > summary::-webkit-details-marker { display: none; }
        .grupo-capitulo > summary::before { content: '▸'; display: inline-block; margin-right: 4px; font-size: 9px; transition: transform 0.2s; }
        .grupo-capitulo[open] > summary::before { transform: rotate(90deg); }
        .grupo-capitulo > summary:hover { background: #f0f2f5; }

        .lista-articulos { display: flex; flex-direction: column; }
        .articulo-item { display: block; padding: 5px 10px 5px 22px; font-size: 12px; color: #333; text-decoration: none; border-radius: 3px; border-left: 2px solid transparent; }
        .articulo-item:hover { background: #f0f2f5; }
        .articulo-item.activo { background: #e8ecf1; color: #1a2a4a; font-weight: 600; border-left-color: #d4a843; }
        .articulo-item.no-vigente { opacity: 0.6; }

        .empty-sidebar { padding: 20px; text-align: center; color: #888; font-size: 13px; }

        .content { flex: 1; overflow-y: auto; padding: 25px 35px; }

        .empty-state { text-align: center; padding: 60px 20px; color: #888; max-width: 500px; margin: 0 auto; }
        .empty-state h2 { color: #1a2a4a; margin-bottom: 10px; font-size: 20px; }
        .error-state { text-align: center; padding: 30px 20px; color: #b33c3c; background: #fff; border: 1px solid #f8d7da; border-radius: 8px; margin: 40px auto; max-width: 600px; line-height: 1.6; }
        .error-state code { background: #f0f2f5; padding: 2px 6px; border-radius: 3px; color: #1a2a4a; }

        .detalle-articulo { max-width: 900px; margin: 0 auto; }
        .detalle-header { border-bottom: 3px solid #1a2a4a; padding-bottom: 15px; margin-bottom: 20px; }
        .detalle-label { font-size: 22px; font-weight: 700; color: #1a2a4a; margin-bottom: 8px; line-height: 1.3; }
        .detalle-titulo, .detalle-capitulo { font-size: 12px; color: #666; margin-top: 4px; }
        .detalle-titulo i, .detalle-capitulo i { color: #d4a843; margin-right: 5px; width: 14px; }

        .detalle-texto { background: #fff; padding: 18px 22px; border-radius: 6px; border: 1px solid #e0e4ea; font-size: 14px; line-height: 1.75; margin-bottom: 20px; white-space: pre-wrap; color: #333; }

        .detalle-incisos, .detalle-modificatorias, .detalle-legacy { margin-bottom: 22px; }
        .detalle-incisos h3, .detalle-modificatorias h3, .detalle-legacy h3 { font-size: 15px; color: #1a2a4a; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid #e0e4ea; }
        .detalle-incisos h3 i, .detalle-modificatorias h3 i, .detalle-legacy h3 i { color: #d4a843; margin-right: 6px; }

        .inciso-block { background: #fafbfc; border-left: 3px solid #1a2a4a; padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; }
        .inciso-label { font-size: 13px; color: #333; line-height: 1.6; }
        .numerales { margin-top: 8px; padding-left: 15px; border-left: 2px solid #d4a843; }
        .numeral-item { font-size: 12.5px; color: #555; line-height: 1.6; padding: 3px 0; }

        .detalle-modificatorias ul { list-style: none; padding: 0; }
        .detalle-modificatorias li { background: #fafbfc; padding: 9px 13px; border-radius: 4px; margin-bottom: 5px; font-size: 13px; line-height: 1.5; }
        .detalle-modificatorias li a { color: #1a2a4a; margin-left: 6px; }
        .badge-derogada { background: #f8d7da; color: #721c24; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; font-weight: 500; }

        .legacy-item { background: #fafbfc; border-left: 3px solid #b33c3c; padding: 10px 15px; margin-bottom: 8px; border-radius: 4px; }
        .legacy-label { font-size: 13px; font-weight: 600; color: #333; margin-bottom: 5px; }
        .legacy-item ul { list-style: disc; padding-left: 20px; font-size: 12px; color: #555; line-height: 1.6; }

        .detalle-fuente { background: #f8f9fa; padding: 12px 15px; border-radius: 4px; font-size: 12px; color: #666; margin-top: 25px; border-top: 2px solid #e0e4ea; line-height: 1.6; }
        .detalle-fuente i { color: #d4a843; margin-right: 5px; }
        .detalle-fuente a { color: #1a2a4a; }

        @media (max-width: 800px) {
            .main { flex-direction: column; }
            .sidebar { width: 100%; max-height: 35vh; border-right: none; border-bottom: 1px solid #e0e4ea; }
            .content { padding: 15px; }
            .header h1 { font-size: 15px; }
            .header .subtitle { display: none; }
            .detalle-label { font-size: 18px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div>
                <h1><i class="fas fa-book-open"></i> CÓDIGO PENAL — PARAGUAY</h1>
                <span class="subtitle">Visor de artículos, incisos y modificatorias</span>
            </div>
        </div>
        <a href="../index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Volver al sistema</a>
    </header>

    <div class="main">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-buscador">
                    <input type="search" id="buscador" placeholder="Buscar por artículo, nombre, título…" aria-label="Buscar artículo" />
                    <button type="button" aria-label="Buscar"><i class="fas fa-search"></i></button>
                </div>
            </div>
            <div class="sidebar-content" id="sidebar-content">
                <div class="empty-sidebar"><i class="fas fa-circle-notch fa-spin"></i> Cargando catálogo…</div>
            </div>
        </aside>

        <main class="content" id="content">
            <div class="empty-state">
                <i class="fas fa-book-open" style="font-size:60px;color:#d0d4da;margin-bottom:20px;"></i>
                <h2>Cargando catálogo…</h2>
                <p>Esperando los datos del Código Penal.</p>
            </div>
        </main>
    </div>

    <script src="datos/catalogo.js"></script>
    <script>
    (function () {
        'use strict';

        function escapeHTML(valor) {
            return String(valor == null ? '' : valor).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            })[c]);
        }

        function normalizar(texto) {
            return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
        }

        const $sidebar = document.getElementById('sidebar-content');
        const $content = document.getElementById('content');
        const $buscador = document.getElementById('buscador');

        let DATA = null;
        let ARTICULOS = [];
        let LEYES = {};
        let LEGACY_POR_NUM = {};
        let POR_ID = {};

        function init() {
            if (!window.CP_DATA) {
                $content.innerHTML = '<div class="error-state"><strong>No se pudo cargar el catálogo.</strong><br>Verificá que exista el archivo <code>codigo-penal/datos/catalogo.js</code> y que la consola del navegador (F12) no muestre errores.</div>';
                return;
            }
            DATA = window.CP_DATA;
            ARTICULOS = Array.isArray(DATA.articulos) ? DATA.articulos : [];
            (DATA.leyes || []).forEach(l => { LEYES[l.id] = l; });

            const legacy = DATA.legacy || {};
            Object.keys(legacy).forEach(k => {
                const item = legacy[k];
                if (item && item.numeroEquivalente) {
                    if (!LEGACY_POR_NUM[item.numeroEquivalente]) LEGACY_POR_NUM[item.numeroEquivalente] = [];
                    LEGACY_POR_NUM[item.numeroEquivalente].push(Object.assign({ _clave: k }, item));
                }
            });

            ARTICULOS.forEach(a => { POR_ID[a.id] = a; });

            renderSidebar('');
            handleHash();

            let t;
            $buscador.addEventListener('input', function () {
                clearTimeout(t);
                t = setTimeout(() => renderSidebar(this.value), 120);
            });

            window.addEventListener('hashchange', handleHash);
        }

        function renderSidebar(filtro) {
            const term = normalizar(filtro).trim();
            const filtrados = term
                ? ARTICULOS.filter(a => normalizar([a.numero, a.nombre, a.label, a.titulo, a.capitulo].join(' ')).includes(term))
                : ARTICULOS;

            $sidebar.innerHTML = '';

            if (!filtrados.length) {
                $sidebar.innerHTML = '<div class="empty-sidebar">Sin resultados</div>';
                return;
            }

            const contador = document.createElement('div');
            contador.className = 'sidebar-counter';
            contador.textContent = filtrados.length + ' artículo' + (filtrados.length !== 1 ? 's' : '');
            $sidebar.appendChild(contador);

            const grupos = new Map();
            filtrados.forEach(a => {
                const titulo = a.titulo || 'Sin título';
                const capitulo = a.capitulo || 'Sin capítulo';
                if (!grupos.has(titulo)) grupos.set(titulo, new Map());
                const caps = grupos.get(titulo);
                if (!caps.has(capitulo)) caps.set(capitulo, []);
                caps.get(capitulo).push(a);
            });

            grupos.forEach((caps, titulo) => {
                const det = document.createElement('details');
                det.className = 'grupo-titulo';
                if (term || grupos.size === 1) det.open = true;
                const sum = document.createElement('summary');
                sum.textContent = titulo;
                det.appendChild(sum);

                caps.forEach((arts, capitulo) => {
                    const detCap = document.createElement('details');
                    detCap.className = 'grupo-capitulo';
                    if (term || caps.size === 1) detCap.open = true;
                    const sumCap = document.createElement('summary');
                    sumCap.textContent = capitulo;
                    detCap.appendChild(sumCap);

                    const lista = document.createElement('div');
                    lista.className = 'lista-articulos';
                    arts.forEach(a => {
                        const aEl = document.createElement('a');
                        aEl.className = 'articulo-item';
                        aEl.href = '#articulo=' + encodeURIComponent(a.id);
                        aEl.dataset.id = a.id;
                        aEl.textContent = a.label || ('Art. ' + a.numero);
                        if (a.vigente === false) aEl.classList.add('no-vigente');
                        lista.appendChild(aEl);
                    });
                    detCap.appendChild(lista);
                    det.appendChild(detCap);
                });

                $sidebar.appendChild(det);
            });

            marcarActivo();
        }

        function marcarActivo() {
            const match = window.location.hash.match(/^#articulo=(.+)$/);
            const id = match ? decodeURIComponent(match[1]) : null;
            document.querySelectorAll('.articulo-item').forEach(el => {
                el.classList.toggle('activo', el.dataset.id === id);
            });
        }

        function handleHash() {
            const match = window.location.hash.match(/^#articulo=(.+)$/);
            if (match) {
                renderDetalle(decodeURIComponent(match[1]));
            } else {
                renderVacio();
            }
            marcarActivo();
        }

        function renderVacio() {
            $content.innerHTML = '<div class="empty-state"><i class="fas fa-book-open" style="font-size:60px;color:#d0d4da;margin-bottom:20px;"></i><h2>Visor del Código Penal</h2><p style="color:#888;margin-top:10px;">Seleccioná un artículo del panel izquierdo para ver su contenido.</p><p style="color:#888;font-size:13px;margin-top:5px;">Total: ' + ARTICULOS.length + ' artículos disponibles.</p></div>';
        }

        function renderDetalle(id) {
            const art = POR_ID[id];
            if (!art) { renderVacio(); return; }

            let html = '<div class="detalle-articulo">';

            html += '<div class="detalle-header">';
            html += '<div class="detalle-label">' + escapeHTML(art.label || ('Art. ' + art.numero)) + '</div>';
            if (art.titulo) html += '<div class="detalle-titulo"><i class="fas fa-folder"></i>' + escapeHTML(art.titulo) + '</div>';
            if (art.capitulo) html += '<div class="detalle-capitulo"><i class="fas fa-file-alt"></i>' + escapeHTML(art.capitulo) + '</div>';
            html += '</div>';

            if (art.texto) {
                html += '<div class="detalle-texto">' + escapeHTML(art.texto) + '</div>';
            }

            if (art.incisos && art.incisos.length) {
                html += '<div class="detalle-incisos"><h3><i class="fas fa-list-ol"></i>Incisos</h3>';
                art.incisos.forEach(inc => {
                    html += '<div class="inciso-block">';
                    html += '<div class="inciso-label">' + escapeHTML(inc.label || inc.texto || '') + '</div>';
                    if (inc.numerales && inc.numerales.length) {
                        html += '<div class="numerales">';
                        inc.numerales.forEach(num => {
                            html += '<div class="numeral-item">' + escapeHTML(num.label || num.texto || '') + '</div>';
                        });
                        html += '</div>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            }

            if (art.modificatorias && art.modificatorias.length) {
                html += '<div class="detalle-modificatorias"><h3><i class="fas fa-gavel"></i>Modificatorias</h3><ul>';
                art.modificatorias.forEach(idLey => {
                    const ley = LEYES[idLey];
                    if (ley) {
                        html += '<li><strong>' + escapeHTML(ley.nombre) + '</strong>';
                        if (ley.descripcion) html += ' — ' + escapeHTML(ley.descripcion);
                        if (ley.estado === 'derogada') html += '<span class="badge-derogada">Derogada</span>';
                        if (ley.fuente) html += ' <a href="' + escapeHTML(ley.fuente) + '" target="_blank" rel="noopener">Fuente <i class="fas fa-external-link-alt"></i></a>';
                        html += '</li>';
                    } else {
                        html += '<li>' + escapeHTML(idLey) + '</li>';
                    }
                });
                html += '</ul></div>';
            }

            const legacyItems = LEGACY_POR_NUM[art.numero] || [];
            if (legacyItems.length) {
                html += '<div class="detalle-legacy"><h3><i class="fas fa-history"></i>Registros históricos</h3>';
                html += '<p style="color:#888;font-size:12px;margin-bottom:8px;">Versiones anteriores vinculadas a este artículo.</p>';
                legacyItems.forEach(item => {
                    html += '<div class="legacy-item">';
                    html += '<div class="legacy-label">' + escapeHTML(item.label || ('Art. ' + item._clave)) + '</div>';
                    if (item.incisos && item.incisos.length) {
                        html += '<ul>';
                        item.incisos.forEach(inc => {
                            html += '<li>' + escapeHTML(inc.label || inc.id || '') + '</li>';
                        });
                        html += '</ul>';
                    }
                    html += '</div>';
                });
                html += '</div>';
            }

            if (art.fuenteTexto) {
                html += '<div class="detalle-fuente"><i class="fas fa-book"></i> <strong>Fuente:</strong> ' + escapeHTML(art.fuenteTexto.nombre || '');
                if (art.fuenteTexto.url) {
                    html += ' — <a href="' + escapeHTML(art.fuenteTexto.url) + '" target="_blank" rel="noopener">Ver documento <i class="fas fa-external-link-alt"></i></a>';
                }
                html += '</div>';
            }

            html += '</div>';
            $content.innerHTML = html;
            $content.scrollTop = 0;
        }

        if (window.CP_DATA) {
            init();
        } else if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            let intentos = 0;
            const intervalo = setInterval(() => {
                if (window.CP_DATA) { clearInterval(intervalo); init(); }
                else if (++intentos > 30) {
                    clearInterval(intervalo);
                    $content.innerHTML = '<div class="error-state"><strong>No se pudo cargar el catálogo.</strong><br>Verificá que exista <code>codigo-penal/datos/catalogo.js</code>.</div>';
                }
            }, 100);
        }
    })();
    </script>
</body>
</html>
